# DeepSeek-V4-Flash-0731 — MoE 284B із 13 млрд активних, випущена 31.07.2026.
# Квант IQ2_M (~91 ГБ): Q4_K_XL, на якому зроблена вся решта серії, важить
# 155 ГБ і в 128 ГБ не влазить. Це свідомий компроміс і його треба памʼятати
# при читанні результатів: слабкий результат неможливо буде однозначно
# віднести до моделі, бо квант помітно грубіший за решту матриці; сильний
# результат, навпаки, буде надійним - грубіший квант працює проти неї.
# Семплінг з картки моделі (їхні агентні заміри: temp 1.0, top-p 0.95).
# ПАРАМЕТРИ ХАРНЕСА (не llama.cpp, тому лише коментарем - інакше llama serve
# спробує передати їх як свої аргументи й не стартує):
#   timeout          = 180 хв для таска 08, 3 прогони на плече (замість 5):
#                      на 120 хв прогін дійшов до правильних відповідей у 4 з
#                      6 полів, але контейнер зняли по ліміту й eval_result не
#                      створився взагалі. При 5 прогонах це до 30 годин.
#   timeout          = 90 хв для таска 07 (решта - 60 хв). Підняте після того,
#                      як на 60 хв четвертий прогін дав 1.00 рівно на межі
#                      3600 с, а пʼятий не встиг узагалі. Медіана вдалого
#                      прогону 2537 с, тобто запас був лише третина ліміту.
#                      Прогони на 60 хв відкладені в
#                      results/llamacpp-gguf/deepseek-t07-t60/.
#   timeout (решта)  = 60 хв   (решта серії йшла з 30; підняте після того, як
#                               обидва прогони таска 04 уперлися в 1800 с -
#                               один із них устиг записати всі поля й дав 1.00,
#                               другий на тій же секунді ще досліджував дані й
#                               дав 0.00, тобто результат вирішував порядок
#                               кроків, а не здатність моделі)
#   memory-gb        = 24
#   iterations       = 5 на плече
#   ТАСКИ 01, 02, 03 зроблені зі СТАРИМ лімітом 30 хв. Переганяти їх не стали:
#   на таску 01 усі 10 прогонів вклалися із запасом, на таску 02 в ліміт уперся
#   один прогін із 10 (без скілів, 0.00) - решта девʼять завершилися самі. Тобто
#   старий ліміт зачепив рівно один прогін із двадцяти. Таск 03 нульовий за
#   будь-якого ліміту.
#   Прогони таска 04 на 30 хв відкладені в
#   results/llamacpp-gguf/deepseek-t30-runs/ і в основний набір не входять.
