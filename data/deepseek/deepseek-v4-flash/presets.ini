# llama.cpp preset this data set was produced with.
#
# Server: llama.cpp `llama serve` (router mode), Apple M5 Max 128GB.
# Sampling values come from the model card (the settings used for its own
# agentic evals). `parallel = 1` matters: the server answers one request at a
# time, so any concurrent query queues ahead of the agent and starves the run.
#
# QUANT. IQ2_M, ~91 GB. Q4_K_XL - the quant the rest of this series used - is
# 155 GB for this model and does not fit in 128 GB. Worth keeping in mind when
# reading the numbers: a weak result could not be attributed to the model with
# confidence, since the quant is visibly coarser than the rest of the matrix;
# a strong result is trustworthy, because the coarser quant works against it.
#
# HARNESS TIMEOUTS, per task. The rest of the series ran at a uniform 30 min.
# This model is the slowest in the set (8.7-15 tok/s against 12-56 for the
# others), and at 30 min the score was decided by whether it had moved from
# exploring the data to writing answers - not by whether it could.
#
#   tasks 01, 02, 03 : 30 min
#   tasks 04, 05, 06 : 60 min
#   task  07         : 90 min
#
# Raised for 04 after both runs hit 1800 s: one had written all four fields
# and scored 1.00, the other was still exploring at the same second and
# scored 0.00. Raised for 07 after a run scored 1.00 exactly at the 3600 s
# mark and the next one did not finish at all; median successful run was
# 2537 s, so the margin was a third of the limit.
#
# Runs made under superseded limits are not in this set.
#
# These are harness settings, not llama.cpp ones, so they live in comments -
# as real keys `llama serve` would try to pass them along and fail to start.

[deepseek-v4-flash]
hf-repo = unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-IQ2_M
jinja = 1
ctx-size = 131072
n-gpu-layers = 99
temp = 1.0
top-k = 64
top-p = 0.95
min-p = 0
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
