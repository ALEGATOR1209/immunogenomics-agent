# llama.cpp preset this data set was produced with.
#
# Kept next to the data so the sampling and context settings are visible
# without having to reconstruct them from someone else's machine.
#
# Server: llama.cpp `llama serve` (router mode), Apple M5 Max 128GB.
# Sampling values are the ones from each model's own model card.
# `parallel = 1` matters: the server answers one request at a time, so a
# concurrent query would queue ahead of the agent and starve the run.

[unsloth/gemma-4-31B-it-GGUF:UD-Q4_K_XL]
hf-repo = unsloth/gemma-4-31B-it-GGUF:UD-Q4_K_XL
jinja = 1
ctx-size = 131072
n-gpu-layers = 99
temp = 1.0
top-k = 64
top-p = 0.95
min-p = 0
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
