categories:
  - name: identification
    fields:
      - name: paper_title
        description: Full title of the associated publication, if any
        detail_level: brief
      - name: authors
        description: Author list or first author + et al.
        detail_level: brief
      - name: year
        description: Publication year
        detail_level: brief
      - name: journal
        description: Journal or preprint server
        detail_level: brief
      - name: doi
        description: DOI or preprint identifier
        detail_level: brief

  - name: data_location
    fields:
      - name: geo_accession
        description: GSE (and relevant GSM) accession number(s)
        detail_level: detailed
      - name: repository_confirmed_geo
        description: >
          Boolean — whether the dataset is actually deposited on GEO
          (not just assumed from the paper being well-known). Several
          candidates found during initial research turned out to be on
          EGA/ArrayExpress/Zenodo instead.
        detail_level: detailed
      - name: alternate_repository
        description: >
          If not on GEO, the real repository and accession (e.g. EGA,
          ArrayExpress) — populated whenever repository_confirmed_geo
          is false
        detail_level: moderate
      - name: supplementary_file_names
        description: Actual filenames found in the GEO supplementary file listing
        detail_level: detailed

  - name: format_specifics
    fields:
      - name: expected_reader_function
        description: >
          Which scirpy loader this item targets (read_tracer, read_airr,
          read_bd_rhapsody)
        detail_level: brief
      - name: native_vs_flattened_output
        description: >
          Enum: native pipeline structure / flattened summary table /
          gene-expression-only (no VDJ deposited). The single most
          decision-relevant field for predicting whether the reader
          works unmodified.
        detail_level: detailed
      - name: file_structure_notes
        description: >
          Concrete description of the file/directory structure actually
          present vs. what the reader function expects
        detail_level: detailed
      - name: pipeline_version
        description: >
          For AIRR-TSV specifically, the Cell Ranger (or other pipeline)
          version — airr_rearrangement.tsv is only a default output from
          Cell Ranger 6+ (~2021+)
        detail_level: moderate

  - name: sample_context
    fields:
      - name: species
        description: Organism (human, mouse, etc.)
        detail_level: brief
      - name: tissue_disease
        description: Tissue type and disease/healthy status
        detail_level: brief
      - name: single_cell_platform
        description: Smart-seq2, 10x, BD Rhapsody, etc.
        detail_level: brief
      - name: species_and_chain_coverage
        description: >
          TCR-only, BCR-only, or paired TCR+BCR; whether both chains
          (alpha/beta or heavy/light) are recovered
        detail_level: moderate
      - name: linked_gex_modality
        description: >
          Whether the same GSE also has matched scRNA-seq/CITE-seq,
          needed to build a scirpy MuData with both gex and airr
          modalities
        detail_level: moderate

  - name: loadability
    fields:
      - name: loadability_confidence
        description: >
          Confidence level (high/medium/low) that the target scirpy
          reader function would work on the GEO files directly vs.
          needing reformatting
        detail_level: detailed
      - name: file_completeness_caveat
        description: >
          Free-text flag for known issues, e.g. "missing raw files due
          to file loss" or "title promises VDJ but files don't contain
          it"
        detail_level: detailed
      - name: reformatting_needed
        description: What transformation (if any) would be needed before loading
        detail_level: moderate

  - name: provenance
    fields:
      - name: verification_method
        description: >
          How the accession was verified — GEO supplementary-file
          listing fetched directly vs. inferred from methods text vs.
          inferred from a search-engine summary. Distinguishes trusted
          entries from ones needing a re-check (a search-engine summary
          falsely linked GSE75688 to TraCeR during initial research).
        detail_level: detailed

uncertain: []
